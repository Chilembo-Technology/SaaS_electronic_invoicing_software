version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chilembo_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_AUTH_API_URL=http://localhost:80/api/v1/auth
      - VITE_ORGANIZATION_API_URL=http://localhost:80/api/v1/organizations

  auth_service:
    build:
      context: ../auth_service
      dockerfile: Dockerfile
    container_name: chilembo_auth_service
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - ../auth_service:/var/www/html
    environment:
      - APP_NAME=auth_service
      - APP_ENV=local
      - APP_DEBUG=true
      - JWT_SECRET=chilembo_jwt_secret_key_2026_super_secure
      - DB_CONNECTION=mysql
      - DB_HOST=db_auth
      - DB_PORT=3306
      - DB_DATABASE=auth_service
      - DB_USERNAME=root
      - DB_PASSWORD=root

  organization_service:
    build:
      context: ../organization_service
      dockerfile: Dockerfile
    container_name: chilembo_organization_service
    restart: always
    ports:
      - "8002:8000"
    volumes:
      - ../organization_service:/var/www/html
    environment:
      - APP_NAME=organization_service
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db_organization
      - DB_PORT=3306
      - DB_DATABASE=organization_service
      - DB_USERNAME=root
      - DB_PASSWORD=root

  proxy:
    image: nginx:alpine
    container_name: chilembo_nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - auth_service
      - organization_service

networks:
  default:
    name: chilembo_network
