server {
    listen 80;
    server_name _;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- Auth Service ----------
    location /api/v1/auth {
        proxy_pass http://chilembo-saas-faturacao-auth-dev:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/users {
        proxy_pass http://chilembo-saas-faturacao-auth-dev:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/otp {
        proxy_pass http://chilembo-saas-faturacao-auth-dev:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Registo público: criação do primeiro administrador com o onboarding_token.
    location /api/v1/onboarding {
        proxy_pass http://chilembo-saas-faturacao-auth-dev:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Rotas internas (serviço-a-serviço) ----------
    # Nunca expostas pelo gateway público: os serviços falam entre si pela rede
    # Docker (shared-services-network). Bloqueio explícito, mesmo que no futuro
    # se acrescente um proxy genérico para /api.
    location /api/internal {
        return 404;
    }

    # ---------- Organization Service ----------
    location /api/v1/company {
        proxy_pass http://chilembo-saas-faturacao-organization-dev:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/organizations {
        proxy_pass http://chilembo-saas-faturacao-organization-dev:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        return 502 'Servico nao disponivel';
    }
}